<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0a1020;
      color: #fff;
      overflow: hidden;
      font-family: "Courier New", monospace;
    }
    #game-wrap {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 20%, #6ab8ff 0%, #1c4e8d 70%);
    }
    #canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100vw;
      max-height: 100vh;
      outline: none;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(8, 12, 22, 0.9);
      z-index: 10;
    }
    .card {
      width: min(88vw, 440px);
      border: 4px solid #fff;
      box-shadow: 0 0 0 3px #000;
      background: #101320;
      padding: 14px;
    }
    .title {
      color: #ff9ad1;
      font-size: 14px;
      margin: 0 0 10px;
      letter-spacing: 1px;
    }
    .bar {
      height: 16px;
      border: 3px solid #fff;
      box-shadow: inset 0 0 0 2px #000;
      background: #0b1a2d;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(90deg, #ff9ad1 0 10px, #ffd37a 10px 20px);
      transition: width .12s linear;
    }
    .hint {
      margin-top: 8px;
      font-size: 11px;
      opacity: .92;
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div id="loader">
    <div class="card">
      <h1 class="title">REINO UNICORNIO</h1>
      <div class="bar"><div id="fill" class="fill"></div></div>
      <div class="hint" id="hint">Cargando aventura...</div>
    </div>
  </div>

  <script>
    const loader = document.getElementById('loader');
    const fill = document.getElementById('fill');
    const canvas = document.getElementById('canvas');

    const godotConfig = $GODOT_CONFIG;
    godotConfig.ensureCrossOriginIsolationHeaders = false;
    const engine = new Engine(godotConfig);

    engine.startGame({
      canvas,
      onProgress: function(current, total) {
        const p = total > 0 ? Math.floor((current / total) * 100) : 0;
        fill.style.width = p + '%';
      }
    }).then(function() {
      loader.style.display = 'none';
      canvas.focus();
    }).catch(function(err) {
      document.getElementById('hint').textContent = 'Error al cargar. Revisa consola.';
      console.error(err);
    });
  </script>
</body>
</html>
