name: Deploy Player to Pages

on:
  push:
    branches:
      - main
      - dev
      - feature/**
    paths:
      - apps/web-player/**
      - apps/godot-player/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        if: ${{ hashFiles('apps/godot-player/project.godot') == '' }}
        run: |
          mkdir -p dist
          cp -R apps/web-player/* dist/

      - name: Setup Godot
        if: ${{ hashFiles('apps/godot-player/project.godot') != '' }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: true

      - name: Build Godot web export
        if: ${{ hashFiles('apps/godot-player/project.godot') != '' }}
        run: |
          mkdir -p apps/godot-player/dist
          godot --headless --path apps/godot-player --export-release Web dist/index.html
          mkdir -p dist
          cp -R apps/godot-player/dist/* dist/

      - name: Add fallback index for Godot assets
        if: ${{ hashFiles('apps/godot-player/project.godot') != '' }}
        run: |
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
